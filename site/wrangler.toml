name = "ragshield-site"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "ragshield-site"
database_id = "REPLACE_WITH_D1_DATABASE_ID"   # from: npx wrangler d1 create ragshield-site

# Secrets are NOT set here. Production: npx wrangler pages secret put <NAME>
#   TURNSTILE_SECRET, IP_SALT, and optionally DISCORD_WEBHOOK_URL, NTFY_URL, NTFY_TOKEN,
#   RESEND_API_KEY, NOTIFY_EMAIL_TO, NOTIFY_EMAIL_FROM
# Local development reads .dev.vars (copy .dev.vars.example).
